[workspace]
resolver = "3"

[workspace.package]
version = "0.6.0-dev.1"
edition = "2024"
rust-version = "1.98"
keywords = ["ASIO", "audio", "media", "sound", "steinberg"]
categories = ["hardware-support", "multimedia", "multimedia::audio"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/DnucleusZ/azo-uzume"

[package]
name = "azo"
description = "ASIO bindings with an exclusive driver owner and explicit registration lifetime"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[features]
default = []
undocumented = ["azo-sys/undocumented"]

[dependencies]
azo-sys = { path = "./azo-sys", version = "=0.6.0-dev.1" }
windows-core = "0.100.0"
windows-registry = "0.100.0"

[build-dependencies]
windows-bindgen = "0.100.0"
